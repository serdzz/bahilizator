[package]
name = "bahilizator"
version = "2.0.0"
edition = "2021"

[dependencies]
# ESP32 DevKit V1 (Xtensa LX6 dual-core)
esp-hal = { version = "~1.0", features = ["esp32", "unstable", "defmt"] }
esp-backtrace = { version = "0.18", features = ["esp32", "defmt", "panic-handler"] }
esp-println = { version = "0.16", features = ["esp32", "defmt-espflash", "critical-section"] }
esp-storage = { version = "0.8", features = ["esp32"] }
esp-bootloader-esp-idf = { version = "0.1" }

# RTOS with Embassy integration
esp-rtos = { version = "0.2", features = ["esp32", "embassy", "defmt"] }

# Embassy (compatible versions from esp-rtos)
embassy-executor = "0.9"
embassy-time = "0.4"
embassy-sync = "0.7"
embassy-futures = "0.1"

# Networking (protocol-level, platform independent)
embassy-net-ppp = "0.2"
embassy-net = { version = "0.7", features = ["defmt", "medium-ip", "proto-ipv4", "dns", "tcp", "udp", "dhcpv4"] }

defmt = "1.0"
critical-section = "1.1"

heapless = "0.8"
one-wire-bus = "0.1"
embedded-hal = { version = "0.2", package = "embedded-hal", features = ["unproven"] }
embedded-hal-async = "1.0"
embedded-io-async = "0.7"
bitflags = "2.6"
static_cell = "2.1"

rust-mqtt = { version = "0.5.1", default-features = false, features = ["v5", "defmt"] }

[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true