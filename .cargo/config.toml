[target.thumbv7m-none-eabi]
runner = "probe-run --chip STM32F103C8"
rustflags = [
    "-C", "linker=flip-link",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=--sort-section=alignment",
]

[build]
target = "thumbv7m-none-eabi"

[env]
DEFMT_LOG = "info"